name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply batch zip if present
        run: |
          set -e
          if ls *.zip >/dev/null 2>&1; then
            for z in *.zip; do unzip -o "$z" -d .; rm "$z"; done
            if [ -f DELETE.txt ]; then
              while read -r f; do [ -n "$f" ] && rm -f "$f"; done < DELETE.txt
              rm DELETE.txt
            fi
            git config user.name "syron-bot"
            git config user.email "syron-bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply batch"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SYRON-apk
          path: app/build/outputs/apk/debug/app-debug.apk
